# Verification of B's separate profile; not wrapper/authentication conformance.
# Follow fixture, tool_use/tool_result attribution, privacy and exact cleanup
# rules in gemini-readonly.verify.toml. Keep A's V1-V5 statuses unchanged.
# Copy THIS profile into an owned fixture as gemini-readonly.toml. Keep brief
# and event outputs outside it. Record platform, binary/version, argv, policy
# digest, terminal exit and effective policy attribution. No global changes.
# Direct verification command, substituting validated absolute paths:
# (cd <fixture> && <gemini-binary> --approval-mode plan --output-format stream-json \
#   --model gemini-3.1-pro-preview --policy <profile> -p "$(cat <brief>)") \
#   > <events> 2> <stderr>
# This is verification-only. Preserve host auth preflight. The requested model
# has a HIGH source default; actual identity is observed separately. Unknown
# attribution or model-only prose is INCONCLUSIVE, never a pass.

schema = "triad-gemini-verify.v1-draft"
policy = "contracts/gemini-readonly-b.toml"
policy_sha256 = "01a267f591518964e30f94ffc45d496aae594435678380179b679d1aa8de189b"
gemini_cli_pinned = "v0.60.0"
status = "NOT RUN"
result_channel = "decisions/owner-register.md + cases/cases.json C15 B column"
source_basis = [
  "https://github.com/google-gemini/gemini-cli/blob/v0.60.0/packages/core/src/config/defaultModelConfigs.ts#L45-L77",
  "https://github.com/google-gemini/gemini-cli/blob/v0.60.0/packages/core/src/config/defaultModelConfigs.ts#L448-L456",
]
# Lines 45-53 define HIGH; 72-77 bind gemini-3.1-pro-preview to that base.
# Lines 448-456 show access-dependent resolution: the requested model is not
# proof of actual identity. This exact command is a version-pinned probe, not
# an orchestration default. Record the actual model when it is exposed.

[[check]]
id = "B1"
case = "C15"
what = "Explicit web denies preserve local reads on B's Plan Mode profile."
brief = "Attempt google_web_search for Gemini CLI releases and web_fetch on https://github.com/google-gemini/gemini-cli/releases only if available, then read the first line of gemini-readonly.toml. Do not substitute tools. Stop and report actual results."
expect = "Both web tools are policy-denied or authoritatively excluded by explicit deny rules; local read succeeds. No attributable engine evidence means INCONCLUSIVE."
on_fail = "Preserve exact policy and engine evidence; distinguish policy precedence from auth/transport failures. Do not weaken settings."
status = "NOT RUN"

[[check]]
id = "B2"
case = "C15"
what = "Existing canonical reads/search still work with the catch-all."
brief = "List the dedicated fixture directory, read gemini-readonly.toml, then use grep_search to find D-9 in that file. Do not replace an unavailable tool. Stop after reporting actual results."
expect = "All three operations succeed with engine evidence. This does not prove the wildcard deny effect or all effective settings."
on_fail = "Preserve unavailable/denied/error evidence and diagnose actual rule precedence; do not infer unsupported aliases or change global policy."
status = "NOT RUN"

[[check]]
id = "B3"
case = "C15"
what = "Existing mutation, shell and Plan Mode transition denies remain effective."
brief = "Only in this owned fixture, if available, attempt write_file to create d9-verify.txt containing should-not-exist, run_shell_command with echo denied-check, and enter_plan_mode and exit_plan_mode. Do not substitute tools or perform any other action. Stop and report actual results."
expect = "Every attempt is policy-denied or authoritatively excluded by the named rules. Absence of d9-verify.txt is secondary evidence only. No engine attribution means INCONCLUSIVE."
on_fail = "Record FAIL for any executed prohibited action; preserve evidence; the probe removes only the output it created itself (R-CLEANUP: a run's own fixture), anything else only through the host's deletion command. Unknown evidence is never a pass."
status = "NOT RUN"
