[build-system]
requires = ["setuptools>=81,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "triad-dispatch-lib"
version = "0.1.0.dev3"
description = "Shared deterministic TRIAD verdict admission"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jsonschema>=4.26,<5", "referencing>=0.37,<1"]

[project.urls]
Repository = "https://github.com/codefoundry-io/triad-dispatch-lib"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
triad_dispatch_lib = ["data/*.json", "data/roster-bundle/*.json", "data/roster-bundle/contracts/*.json", "data/prompt-bundle/*.json", "data/prompt-bundle/prompts/*.md", "data/prompt-bundle/contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "spec/tests"]
addopts = "--import-mode=importlib"
