name: Test package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Verified source commit: $actual_sha"
          git rev-parse HEAD^{tree}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.8'
          enable-cache: false
      - run: uv sync --locked
      - name: Verify selected Python
        run: |
          uv run --locked python - <<'PY'
          import os, platform, sys
          assert '.'.join(map(str, sys.version_info[:2])) == os.environ['UV_PYTHON']
          print({'python': platform.python_version(), 'executable': sys.executable})
          PY
      - run: uv run --locked pytest -q
      - run: uv run --locked python tools/sync_spec_assets.py --check
      - run: uv run --locked python spec/tools/check_authoring.py
      - name: Build and unpack sdist outside the checkout
        run: |
          uv build --sdist
          uv run --locked python - <<'PY'
          from pathlib import Path
          import os, tarfile
          root = Path(os.environ["RUNNER_TEMP"]) / "triad-sdist"
          root.mkdir()
          with tarfile.open("dist/triad_dispatch_lib-0.1.0.dev3.tar.gz") as archive:
              archive.extractall(root, filter="data")
          source, = root.iterdir()
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SDIST_SOURCE={source}\n")
          PY
      - name: Verify and rebuild from unpacked sdist
        working-directory: ${{ env.SDIST_SOURCE }}
        run: |
          unset VIRTUAL_ENV
          uv sync --locked
          uv run --locked python -c "import os, sys; assert '.'.join(map(str, sys.version_info[:2])) == os.environ['UV_PYTHON']; print(sys.version)"
          uv run --locked pytest -q
          uv run --locked python spec/tools/check_authoring.py
          uv run --locked python tools/sync_spec_assets.py --check
          uv build --wheel
      - name: Verify installed wheel and binary dependencies
        run: uv run --locked python tools/verify_wheel.py "${{ env.SDIST_SOURCE }}/dist/triad_dispatch_lib-0.1.0.dev3-py3-none-any.whl"
      - name: Verify installed Codex prompt and admission driver
        run: uv run --locked python tools/codex_smoke.py --wheel "${{ env.SDIST_SOURCE }}/dist/triad_dispatch_lib-0.1.0.dev3-py3-none-any.whl" --expected-version 0.1.0.dev3 self-test
      - name: Verify installed four-route synthetic matrix
        run: uv run --locked python tools/four_route_smoke.py --wheel "${{ env.SDIST_SOURCE }}/dist/triad_dispatch_lib-0.1.0.dev3-py3-none-any.whl" --expected-version 0.1.0.dev3
      - run: git diff --exit-code
      - name: Verify installed supervised callback synthetic exchange
        run: uv run --locked python tools/native_codex_smoke.py --wheel "${{ env.SDIST_SOURCE }}/dist/triad_dispatch_lib-0.1.0.dev3-py3-none-any.whl" --expected-version 0.1.0.dev3 --self-test
