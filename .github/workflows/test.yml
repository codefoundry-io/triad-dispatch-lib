name: Test package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.8'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - name: Build wheel from sdist
        run: |
          uv build --sdist
          uv build dist/triad_dispatch_lib-0.1.0.dev2.tar.gz --wheel
      - name: Verify installed wheel and binary dependencies
        run: uv run --locked python tools/verify_wheel.py dist/triad_dispatch_lib-0.1.0.dev2-py3-none-any.whl
      - name: Verify installed Codex prompt and admission driver
        run: uv run --locked python tools/codex_smoke.py --wheel dist/triad_dispatch_lib-0.1.0.dev2-py3-none-any.whl --expected-version 0.1.0.dev2 self-test
      - name: Verify installed four-route synthetic matrix
        run: uv run --locked python tools/four_route_smoke.py --wheel dist/triad_dispatch_lib-0.1.0.dev2-py3-none-any.whl --expected-version 0.1.0.dev2
      - name: Run tests from the source distribution
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          import os, subprocess, tarfile, tempfile
          child_env = os.environ.copy()
          child_env.pop("VIRTUAL_ENV", None)
          with tempfile.TemporaryDirectory(prefix="triad-sdist-") as temporary:
              root = Path(temporary)
              with tarfile.open("dist/triad_dispatch_lib-0.1.0.dev2.tar.gz") as archive:
                  archive.extractall(root, filter="data")
              source, = root.iterdir()
              subprocess.run(["uv", "run", "--locked", "pytest", "-q"], cwd=source, env=child_env, check=True)
          PY
      - run: git diff --exit-code
      - name: Verify installed supervised callback synthetic exchange
        run: uv run --locked python tools/native_codex_smoke.py --wheel dist/triad_dispatch_lib-0.1.0.dev2-py3-none-any.whl --expected-version 0.1.0.dev2 --self-test
