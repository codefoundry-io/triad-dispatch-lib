name: Test package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.8'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - name: Build wheel from sdist
        run: |
          uv build --sdist
          uv build dist/*.tar.gz --wheel
      - name: Verify installed wheel and binary dependencies
        run: uv run --locked python tools/verify_wheel.py dist/*.whl
      - run: git diff --exit-code
